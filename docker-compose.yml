services:
  backend:
    build: ./backend
    container_name: mirofish-backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads

  web:
    build: ./frontend
    container_name: mirofish-web
    ports:
      - "3333:80"
    depends_on:
      - backend
    restart: unless-stopped
